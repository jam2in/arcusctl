# For more configuration options, see:
# https://zookeeper.apache.org/doc/r3.5.9/zookeeperAdmin.html#sc_configuration
# 192.0.2.0/24 is reserved for documentation. Replace it with addresses from your environment.

name: my-ensemble                                # required
path: /home/arcus/apps/zookeeper                      # required

servers:
  - myid: 1                                      # required
    address: 192.0.2.11:2181:2888:3888           # required (host:clientPort:quorumPort:electionPort)
    config:                                      # optional - per-node override
      data_log_dir: /data/zookeeper/txlog-1

  - myid: 2
    address: 192.0.2.12:2181:2888:3888

  - myid: 3
    address: 192.0.2.13:2181:2888:3888

global_config:
  # optional (default: 2000)
  tick_time: 2000

  # optional (default: 10) - ticks for follower to sync to leader
  init_limit: 10

  # optional (default: 5) - ticks between request and ack
  sync_limit: 5

  # optional (default: <path>/data/<name>)
  data_dir: /var/lib/zk/data

  # optional (default: data_dir)
  data_log_dir: /var/lib/zk/datalog

  # optional - other ZK options (string values only)
  properties:
    maxClientCnxns: "60"
    autopurge.snapRetainCount: "10"
    autopurge.purgeInterval: "24"
